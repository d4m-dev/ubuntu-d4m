# ============================================================
# 🎨 D4M FRONTEND — Nginx config
# Phục vụ React SPA + proxy /api và /static tới backend
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API → backend (FastAPI port 16868 trong docker network)
    location /api/ {
        proxy_pass http://backend:16868;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 🖼️💎 SOCIAL HUB ASSETS — khung viền (429) + Linh thú/Linh bảo (165) + manifests
    # (^~ thắng mọi regex bên dưới → proxy thẳng về backend, không rơi vào root SPA)
    location ^~ /avatar_frames/ {
        proxy_pass http://backend:16868;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /linhbao/ {
        proxy_pass http://backend:16868;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /avatar_frames.json {
        proxy_pass http://backend:16868;
        proxy_set_header Host $host;
    }
    location = /spirit_items.json {
        proxy_pass http://backend:16868;
        proxy_set_header Host $host;
    }

    # SPA routing — mọi đường dẫn fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
