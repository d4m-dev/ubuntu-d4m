<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tu Vi - Phàm Nhân Tu Tiên</title>
    <link rel="stylesheet" href="phamtien_styles.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .profile-card { text-align: center; padding: 20px; border-bottom: 2px solid #334155; margin-bottom: 20px; }
        .tier-title { color: #94a3b8; font-size: 1.2rem; margin-bottom: 15px; }
        .exp-bar-bg { background: #334155; height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        .exp-bar-fill { background: #38bdf8; height: 100%; width: 0%; transition: width 0.3s; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px; }
        button:hover { background: #2563eb; transform: scale(1.05); }
        .btn-small { background: #64748b; font-size: 0.9rem; padding: 8px 15px; }
        .btn-small:hover { background: #475569; }
        .btn-cheat { background: #f59e0b; }
        .btn-breakthrough { background: #ef4444; animation: pulse 1s infinite; display: none;}
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .realms-container { display: flex; gap: 15px; justify-content: space-between; }
        .realm-card { flex: 1; height: 150px; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; border: 2px solid #334155; transition: 0.3s; background-size: cover; background-position: center; }
        .realm-card[data-realm="nhan_gioi"] { background-image: url('./nhan-gioi/nhan-gioi.png'); }
        .realm-card[data-realm="linh_gioi"] { background-image: url('./linh-gioi/linh-gioi.png'); }
        .realm-card[data-realm="tien_gioi"] { background-image: url('./tien-gioi/tien-gioi.png'); }
        .realm-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); transition: 0.3s; }
        .realm-card:hover::after { background: rgba(0,0,0,0.1); }
        .realm-name { position: absolute; bottom: 10px; left: 10px; z-index: 2; font-weight: bold; font-size: 1.2rem; text-shadow: 2px 2px 4px #000; }
        .realm-card.locked { filter: grayscale(100%) brightness(0.4); cursor: not-allowed; }
        .realm-card.locked::before { content: '🔒 Chưa Phi Thăng'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; color: #ef4444; font-weight: bold; font-size: 1.1rem; text-align: center; width: 100%; }
        .realm-card.active { border-color: #38bdf8; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }
        .content-area { margin-top: 20px; padding: 20px; background: #0f172a; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <h3 style="margin:0; color:#cbd5e1;">Đạo Hữu</h3>
        <span id="playerName" class="dao-huu-name">Lạc Nhật Đạo Tổ</span>
        <div id="tierTitle" class="tier-title">Đang dò xét tu vi...</div>
        <div>Điểm Tu Vi: <span id="currentExpText">0</span> / <span id="nextExpText">?</span></div>
        <div class="exp-bar-bg"><div id="expBar" class="exp-bar-fill"></div></div>
        
        <button onclick="addExp(20)" class="btn-small">Tập Thể Dục (+20)</button>
        <button onclick="addExp(10000)">Khổ Tu (+10.000)</button>
        <button onclick="addExp(25000000)" class="btn-cheat">Dùng Tiên Đan (+25.000.000)</button>
        <button id="btnBreakthrough" onclick="triggerTribulation()" class="btn-breakthrough">⚡ ĐỘ KIẾP ĐỘT PHÁ</button>
    </div>

    <h3 style="text-align:center;">🗺️ Bản Đồ Vạn Giới</h3>
    <div class="realms-container">
        <div class="realm-card active" id="btn-Nhân Giới" onclick="switchRealm('Nhân Giới')" data-realm="nhan_gioi"><div class="realm-name">Nhân Giới</div></div>
        <div class="realm-card locked" id="btn-Linh Giới" onclick="switchRealm('Linh Giới')" data-realm="linh_gioi"><div class="realm-name">Linh Giới</div></div>
        <div class="realm-card locked" id="btn-Tiên Giới" onclick="switchRealm('Tiên Giới')" data-realm="tien_gioi"><div class="realm-name">Tiên Giới</div></div>
    </div>
    <div id="realmContent" class="content-area">Đang ở Nhân Giới...</div>
</div>

<script>
    let cultivationData = [];
    let userExp = 0; 
    let currentLevelIndex = 0;
    let unlockedRealms = ['Nhân Giới'];
    
    async function loadSystem() {
        try {
            const response = await fetch('./tu-vi-sys.json');
            const data = await response.json();
            cultivationData = data.realms;
            injectFontsToHead(cultivationData);
            updateCultivation();
        } catch (error) {
            console.error("Lỗi:", error);
            document.getElementById('tierTitle').innerText = "Tẩu hỏa nhập ma! Không tìm thấy tu-vi-sys.json";
        }
    }

    function injectFontsToHead(realms) {
        let styleStr = "";
        let loadedFonts = {};
        realms.forEach(realm => {
            if (!loadedFonts[realm.font_name] && realm.font_file) {
                let format = realm.font_file.endsWith('.otf') ? 'opentype' : 'truetype';
                styleStr += `@font-face { font-family: '${realm.font_name}'; src: url('${realm.font_file}') format('${format}'); font-display: swap; }\n`;
                loadedFonts[realm.font_name] = true;
            }
        });
        const styleTag = document.createElement('style');
        styleTag.innerHTML = styleStr;
        document.head.appendChild(styleTag);
    }

    function addExp(amount) {
        userExp += amount;
        updateCultivation();
    }

    function updateCultivation() {
        if(cultivationData.length === 0) return;
        let newIndex = 0;
        for (let i = 0; i < cultivationData.length; i++) {
            if (userExp >= cultivationData[i].required_exp) newIndex = i;
        }

        if (newIndex !== currentLevelIndex) {
            let newRealm = cultivationData[newIndex].major_realm;
            currentLevelIndex = newIndex;
            
            if (cultivationData[newIndex].tribulation.has_tribulation) {
                document.getElementById('btnBreakthrough').style.display = "inline-block";
            } else {
                document.getElementById('btnBreakthrough').style.display = "none";
            }

            if (newRealm.includes("Linh Giới") && !unlockedRealms.includes("Linh Giới")) {
                unlockedRealms.push("Linh Giới");
                switchRealm("Linh Giới");
                alert("Chúc mừng! Đã xé rách không gian, phi thăng Linh Giới!");
            }
            if (newRealm.includes("Tiên Giới") && !unlockedRealms.includes("Tiên Giới")) {
                unlockedRealms.push("Tiên Giới");
                switchRealm("Tiên Giới");
                alert("Chúc mừng! Đã phi thăng Tiên Giới!");
            }
        }
        renderUI();
    }

    function triggerTribulation() {
        const nameEl = document.getElementById('playerName');
        nameEl.classList.add('is-tribulation');
        alert("Đang chịu " + cultivationData[currentLevelIndex].tribulation.name + "!");
        setTimeout(() => {
            nameEl.classList.remove('is-tribulation');
            document.getElementById('btnBreakthrough').style.display = "none";
        }, 3000);
    }

    function switchRealm(realmName) {
        if (!unlockedRealms.includes(realmName)) {
            alert("🔒 Cảnh giới chưa đủ!"); return;
        }
        document.querySelectorAll('.realm-card').forEach(card => card.classList.remove('active'));
        document.getElementById('btn-' + realmName).classList.add('active');
        document.getElementById('realmContent').innerText = `Ngài đang dạo bước tại ${realmName}.`;
    }

    function renderUI() {
        if(cultivationData.length === 0) return;
        const data = cultivationData[currentLevelIndex];
        const nameEl = document.getElementById('playerName');
        
        nameEl.style.setProperty('--tier-font', `'${data.font_name}', sans-serif`);
        nameEl.style.setProperty('--tier-fallback-color', data.text_effect.fallback_color);
        nameEl.style.setProperty('--tier-gradient', data.text_effect.fallback_gradient);
        nameEl.style.setProperty('--tier-gif', data.bg_gif ? `url('${data.bg_gif}')` : 'none');
        nameEl.style.setProperty('--tier-glow', data.text_effect.glow_shadow);

        document.getElementById('tierTitle').innerText = data.display_title;
        document.getElementById('currentExpText').innerText = userExp.toLocaleString('vi-VN');
        
        let nextLevel = cultivationData[currentLevelIndex + 1];
        if (!nextLevel) {
            document.getElementById('nextExpText').innerText = "Vô Cực";
            document.getElementById('expBar').style.width = "100%";
        } else {
            document.getElementById('nextExpText').innerText = nextLevel.required_exp.toLocaleString('vi-VN');
            let currentFloor = data.required_exp;
            let currentCeil = nextLevel.required_exp;
            let percent = ((userExp - currentFloor) / (currentCeil - currentFloor)) * 100;
            document.getElementById('expBar').style.width = Math.min(percent, 100) + "%";
        }

        ['Nhân Giới', 'Linh Giới', 'Tiên Giới'].forEach(realm => {
            const card = document.getElementById('btn-' + realm);
            if (unlockedRealms.includes(realm)) card.classList.remove('locked');
            else card.classList.add('locked');
        });
    }

    loadSystem();
</script>
</body>
</html>
